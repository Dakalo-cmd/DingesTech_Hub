<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | Dinges TechHub</title>
<meta name="robots" content="noindex,nofollow">

<style>

:root{
    --primary:#3C1542;
    --secondary:#7A2C78;
    --accent:#FFBB42;
    --black:#020202;
    --background:#f7f5f8;
    --text:#222222;
    --muted:#777477;
    --border:#e5e0e7;
    --success:#198754;
    --danger:#dc3545;
    --info:#4b3c52;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Inter,Manrope,Arial,Helvetica,sans-serif;
    background:var(--background);
    color:var(--text);
    min-height:100vh;
    -webkit-text-size-adjust:100%;
}

.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.topbar{
    min-height:70px;
    background:var(--primary);
    display:flex;
    align-items:center;
    padding:0 6%;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.logo{height:44px;}

.main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 16px;
}

.card{
    width:min(420px,100%);
    background:#fff;
    border-radius:20px;
    padding:34px 28px;
    box-shadow:0 25px 75px rgba(60,21,66,.16);
}

.eyebrow{
    color:var(--secondary);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    font-weight:900;
    margin-bottom:8px;
    text-align:center;
}

.title{
    color:var(--primary);
    font-size:24px;
    font-weight:900;
    margin-bottom:8px;
    text-align:center;
}

.subtitle{
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
    margin-bottom:26px;
    text-align:center;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#3f3a40;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
}

input{
    width:100%;
    height:48px;
    border:1px solid var(--border);
    background:#faf9fb;
    border-radius:10px;
    outline:none;
    font-family:inherit;
    font-size:16px; /* prevents iOS zoom on focus */
    color:#222;
    padding:0 14px;
    transition:.2s ease;
}

input:focus{
    border-color:var(--secondary);
    background:#fff;
    box-shadow:0 0 0 4px rgba(122,44,120,.08);
}

.primary-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:#fff;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    margin-top:6px;
    transition:.25s ease;
}

.primary-btn:hover{
    background:var(--secondary);
}

.primary-btn:disabled{
    opacity:.6;
    cursor:wait;
}

.message{
    display:none;
    margin-top:14px;
    padding:12px;
    border-radius:9px;
    font-size:11px;
    line-height:1.5;
}

.message.success{display:block;background:#e9f7ef;color:var(--success);}
.message.error{display:block;background:#fdecec;color:var(--danger);}
.message.info{display:block;background:#f1edf5;color:var(--info);}

.loading-spinner{
    display:inline-block;
    width:12px;
    height:12px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:-2px;
    margin-right:7px;
}

@keyframes spin{to{transform:rotate(360deg);}}

.back-link{
    display:block;
    text-align:center;
    margin-top:20px;
    color:var(--muted);
    font-size:11px;
    text-decoration:none;
}

.back-link:hover{
    color:var(--secondary);
}

@media(max-width:480px){
    .card{padding:26px 20px;border-radius:16px;}
    .title{font-size:21px;}
}

</style>

</head>
<body>

<div class="page">

<header class="topbar">
    <img src="/dingestech-logo.png" alt="Dinges TechHub" class="logo">
</header>

<main class="main">

<div class="card">

    <div class="eyebrow">Staff Access</div>
    <div class="title">Admin Login</div>
    <div class="subtitle">Sign in with your WHMCS staff credentials to access the Dinges TechHub admin dashboard.</div>

    <form id="adminLoginForm" novalidate>

        <div class="form-group">
            <label for="adminUsername">Username</label>
            <input type="text" id="adminUsername" name="username" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="primary-btn" id="adminLoginButton">Login</button>

        <div id="adminLoginMessage" class="message"></div>

    </form>

    <a href="/" class="back-link">← Back to Dinges TechHub</a>

</div>

</main>

</div>

<script>

const ADMIN_LOGIN_API =
    "https://register.web.za/api/admin-login.php";

const ADMIN_DASHBOARD_URL =
    "https://register.web.za/api/admin-dashboard.php";

const form =
    document.getElementById("adminLoginForm");

const button =
    document.getElementById("adminLoginButton");

const message =
    document.getElementById("adminLoginMessage");


async function parseApiResponse(response){

    const text = await response.text();

    let json = null;

    try{
        if(text.trim()){
            json = JSON.parse(text);
        }
    }catch(error){
        console.error("API INVALID JSON:", error);
    }

    return { text: text.trim(), json: json };

}


form.addEventListener("submit", async function(event){

    event.preventDefault();

    const username =
        document.getElementById("adminUsername").value.trim();

    const password =
        document.getElementById("adminPassword").value;


    if(!username || !password){

        message.className = "message error";
        message.textContent = "Please enter both your username and password.";
        return;

    }


    button.disabled = true;
    button.innerHTML = '<span class="loading-spinner"></span>Signing in...';

    message.className = "message info";
    message.textContent = "Checking credentials...";


    try{

        const response = await fetch(
            ADMIN_LOGIN_API,
            {
                method: "POST",
                body: JSON.stringify({ username: username, password: password }),
                credentials: "include",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const result = await parseApiResponse(response);

        if(response.ok && result.json && result.json.success === true){

            message.className = "message success";
            message.textContent = "Login successful. Redirecting...";

            setTimeout(function(){
                window.location.href = ADMIN_DASHBOARD_URL;
            }, 400);

            return;

        }

        message.className = "message error";
        message.textContent =
            (result.json && result.json.message) ||
            "Invalid username or password.";

        button.disabled = false;
        button.textContent = "Login";

    }catch(error){

        console.error("ADMIN LOGIN ERROR:", error);

        message.className = "message error";
        message.textContent =
            "Unable to connect to the admin login service. Please try again.";

        button.disabled = false;
        button.textContent = "Login";

    }

});

</script>

</body>
</html>
